name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerer_donnees:
        description: "Rejouer le pipeline de données Sandre (téléchargement + graphe + tuiles)"
        type: boolean
        default: false

# Les PMTiles nationaux sont versionnés (~77 Mo) : le déploiement courant ne
# dépend donc pas de la disponibilité des services Sandre. Le pipeline complet
# (≈1 Go de téléchargement, ~10 min) reste rejouable à la demande via
# « Run workflow » en cochant « regenerer_donnees ».
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Outils géospatiaux
        if: inputs.regenerer_donnees
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin tippecanoe
          pip install geopandas shapely pyogrio pandas

      - name: Pipeline de données (Sandre → graphe → PMTiles)
        if: inputs.regenerer_donnees
        run: ./scripts/run-all.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build du frontend
        working-directory: web
        env:
          # DSN injecté au build (jamais commité) — secret GitHub GLITCHTIP_DSN.
          VITE_GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          # Analitique Plausible auto-hébergée — domaine public, pas de secret
          # requis. Le script de tracking n'est injecté que si cette variable
          # est définie (no-op en dev local).
          VITE_PLAUSIBLE_DOMAIN: "analytics.devprocore.com"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
