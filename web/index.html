<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bassins versants de France</title>
    <meta
      name="description"
      content="Carte interactive des bassins versants et des fleuves de France métropolitaine, d'après la BD Topage® (Sandre / OFB) : longueur cumulée amont, affluents, bassins agrégés par fleuve."
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="sidebar-header">
          <h1>Bassins versants</h1>
          <p class="subtitle">France métropolitaine · BD Topage® 2025</p>
          <p id="zone-stats" class="stats">Chargement…</p>
        </header>

        <nav id="tabs" class="tabs" role="tablist" aria-label="Sections">
          <button type="button" class="tab is-active" data-onglet="fleuves" role="tab">
            Fleuves principaux
          </button>
          <button type="button" class="tab" data-onglet="recherche" role="tab">
            Recherche
          </button>
        </nav>

        <section id="panneau-fleuves" class="panneau">
          <p class="hint">
            Classés par longueur cumulée de leur réseau amont. Un clic affiche le
            bassin agrégé et ses statistiques.
          </p>
          <ul id="fleuves" class="fleuves" role="listbox" aria-label="Fleuves principaux"></ul>
        </section>

        <section id="panneau-recherche" class="panneau" hidden>
          <div class="search-block">
            <input
              id="search"
              type="search"
              placeholder="Rechercher un bassin, une rivière, un lac…"
              autocomplete="off"
              aria-label="Rechercher une entité"
            />
            <div id="filters" class="filters" role="group" aria-label="Filtrer par couche">
              <button type="button" class="chip is-active" data-couche="tous">Tout</button>
              <button type="button" class="chip" data-couche="bassins">Bassins</button>
              <button type="button" class="chip" data-couche="cours_eau">Cours d'eau</button>
              <button type="button" class="chip" data-couche="plans_eau">Plans d'eau</button>
            </div>
          </div>
          <p id="result-count" class="result-count"></p>
          <ul id="results" class="results" role="listbox" aria-label="Résultats"></ul>
        </section>

        <footer class="sidebar-footer">
          <p>
            Données <a href="https://www.sandre.eaufrance.fr/" target="_blank" rel="noopener">BD Topage® 2025</a>
            — Sandre / OFB ·
            <a href="https://github.com/Sharper8/hydro-viz" target="_blank" rel="noopener">code source</a>
          </p>
        </footer>
      </aside>

      <main id="map-wrap">
        <div id="map"></div>

        <div class="controls">
          <div id="slider-block" class="slider-block">
            <label for="importance">
              Importance minimale des rivières
              <output id="importance-valeur">toutes</output>
            </label>
            <input
              id="importance"
              type="range"
              min="0"
              max="11"
              step="1"
              value="0"
              aria-describedby="importance-valeur"
            />
          </div>

          <div id="basemap-switch" class="basemap-switch" role="group" aria-label="Fond de carte">
            <button type="button" class="is-active" data-fond="sombre">Sombre</button>
            <button type="button" data-fond="plan">Plan IGN</button>
            <button type="button" data-fond="ortho">Photo</button>
            <button type="button" data-fond="osm">OSM</button>
          </div>

          <div id="couches" class="couches" role="group" aria-label="Couches affichées">
            <label><input type="checkbox" data-couche="bassins" checked /> Bassins versants</label>
            <label><input type="checkbox" data-couche="plans_eau" checked /> Plans d'eau</label>
            <label><input type="checkbox" data-couche="bassins_hydro" checked /> Grands bassins</label>
            <label><input type="checkbox" data-couche="her1" /> Hydroécorégions</label>
          </div>
        </div>

        <div id="legend" class="legend">
          <h2>Fleuve récepteur</h2>
          <ul id="legend-items"></ul>
        </div>

        <section id="info-panel" class="info-panel" hidden aria-live="polite">
          <button type="button" id="info-close" class="info-close" aria-label="Fermer">&times;</button>
          <p id="info-kind" class="info-kind"></p>
          <h2 id="info-name"></h2>
          <dl id="info-attrs"></dl>
          <button type="button" id="info-zoom" class="info-zoom">Zoomer sur l'entité</button>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
